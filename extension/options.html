<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DM Integration settings</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, "Segoe UI", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 18px; }
  label { display: block; margin: 18px 0 5px; font-weight: 600; }
  .hint { font-weight: 400; opacity: .7; font-size: 12px; }
  input[type=text], input[type=number] { width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid #8886; background: transparent; color: inherit; font: inherit; }
  .check { display: flex; gap: 8px; align-items: center; margin: 14px 0; }
  .check label { margin: 0; }
  button { font: inherit; padding: 8px 16px; border-radius: 7px; border: 0; background: #4f9cf9; color: #05070c; font-weight: 600; cursor: pointer; margin-top: 22px; }
  #saved { margin-left: 12px; color: #3ecf8e; opacity: 0; transition: opacity .2s; }
  #saved.show { opacity: 1; }
</style>
</head>
<body>
<h1>DM Integration</h1>

<div class="check">
  <input type="checkbox" id="enabled">
  <label for="enabled">Intercept downloads and send them to DM</label>
</div>

<label for="minSize">Minimum size to intercept <span class="hint">(MiB -- smaller files stay in Chrome)</span></label>
<input type="number" id="minSize" min="0" step="0.1">

<div class="check">
  <input type="checkbox" id="captureUnknownSize">
  <label for="captureUnknownSize">Also intercept when the size is unknown</label>
</div>

<label for="skipExtensions">Never intercept these file types <span class="hint">(comma separated)</span></label>
<input type="text" id="skipExtensions">

<div class="check">
  <input type="checkbox" id="notify">
  <label for="notify">Show a notification on handoff</label>
</div>

<button id="save">Save</button><span id="saved">Saved</span>
<script src="options.js"></script>
</body>
</html>
