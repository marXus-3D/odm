# Builds ODM-Setup.exe, the extension zip and the signed .crx on a tag and
# publishes them as a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in cmd/odm-installer/main.go and in
# extension/manifest.json; the first step refuses otherwise.
#
# Set the repository secret EXTENSION_SIGNING_KEY to the contents of your
# %APPDATA%\odm\extension_key.pem so the extension keeps the same id from
# release to release. Without it a fresh key is generated for the build and
# the id changes, which browsers treat as a different extension.
#
# Set AMO_JWT_ISSUER and AMO_JWT_SECRET (from addons.mozilla.org, under Manage
# API Keys) to have Mozilla sign the Firefox add-on. It is submitted to the
# unlisted channel, which signs it without a public store listing. Without
# these the Firefox build still happens but ships unsigned, and release
# Firefox refuses to install an unsigned add-on.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Read at the job level so the signing step can decide whether to run:
    # secrets are not visible to a step-level `if`.
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The release notes are built from the commits since the previous
          # tag, so the whole history has to be here.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # No third-party modules, so there is no go.sum to key a cache on.
          cache: false

      - name: Check the tag matches the code
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $code = (Select-String -Path cmd/odm-installer/main.go -Pattern 'const Version = "([^"]+)"').Matches[0].Groups[1].Value
          $ext = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $code -or $tag -ne $ext) {
            Write-Error "tag is $tag, the installer says $code, the extension says $ext"
            exit 1
          }
          Write-Host "version $tag"

      - name: Restore the extension signing key
        shell: pwsh
        env:
          KEY: ${{ secrets.EXTENSION_SIGNING_KEY }}
        run: |
          if ($env:KEY) {
            $path = Join-Path $env:RUNNER_TEMP "extension_key.pem"
            [IO.File]::WriteAllText($path, $env:KEY)
            "DM_EXTENSION_KEY=$path" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Write-Host "signing key restored"
          } else {
            Write-Warning "EXTENSION_SIGNING_KEY is not set; the extension id will differ from other releases"
          }

      # Before the build, not after: Mozilla can reject a submission, and a
      # release that has already published its Chrome assets cannot be rerun
      # cleanly. Failing here leaves nothing behind.
      - name: Sign the Firefox add-on
        if: env.AMO_JWT_ISSUER != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/ffsign" | Out-Null
          npx --yes web-ext@8 sign `
            --source-dir extension `
            --channel unlisted `
            --api-key $env:AMO_JWT_ISSUER `
            --api-secret $env:AMO_JWT_SECRET `
            --artifacts-dir "$env:RUNNER_TEMP/ffsign"
          if ($LASTEXITCODE -ne 0) { throw "web-ext sign failed" }
          Get-ChildItem "$env:RUNNER_TEMP/ffsign" -Filter *.xpi | ForEach-Object { $_.Name }

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Collect the signed add-on
        if: env.AMO_JWT_ISSUER != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem "$env:RUNNER_TEMP/ffsign" -Filter *.xpi | Select-Object -First 1
          if (-not $signed) { throw "signing reported success but produced no .xpi" }
          $version = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          # The unsigned copy build.ps1 makes is for about:debugging only, and
          # shipping both invites installing the one that cannot be installed.
          Remove-Item "dist/odm-firefox-$version-unsigned.xpi" -ErrorAction SilentlyContinue
          Copy-Item $signed.FullName "dist/odm-firefox-$version.xpi"
          Write-Host "signed add-on: $($signed.Name)"

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
            }
          # Written with LF: Set-Content on Windows gives CRLF, and the stray
          # carriage returns make "sha256sum -c" fail to find the files.
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      # --generate-notes lists merged pull requests, and there are none here:
      # everything lands straight on master. Build the notes from the commit
      # subjects instead, which are Conventional Commits, so they group.
      - name: Write the release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          Write-Host "notes from $range"

          $added = @(); $fixed = @(); $other = @()
          foreach ($s in (git log $range --no-merges --pretty=%s)) {
            if ($s -match '^release:') { continue }
            $text = ($s -replace '^[a-z]+(\([^)]*\))?!?:\s*', '')
            $text = $text.Substring(0, 1).ToUpper() + $text.Substring(1)
            switch -Regex ($s) {
              '^feat'                     { $added += $text; break }
              '^(fix|perf)'               { $fixed += $text; break }
              '^(refactor|style|rename)'  { $other += $text; break }
              default                     { }
            }
          }

          $out = New-Object Collections.Generic.List[string]
          if ($added.Count) { $out.Add("### Added"); $added | ForEach-Object { $out.Add("- $_") }; $out.Add("") }
          if ($fixed.Count) { $out.Add("### Fixed"); $fixed | ForEach-Object { $out.Add("- $_") }; $out.Add("") }
          if ($other.Count) { $out.Add("### Changed"); $other | ForEach-Object { $out.Add("- $_") }; $out.Add("") }
          if ($out.Count -eq 0) { $out.Add("Maintenance release.") ; $out.Add("") }
          if ($prev) {
            $out.Add("**Full changelog**: https://github.com/${{ github.repository }}/compare/$prev...$tag")
          }
          [IO.File]::WriteAllText("$PWD/RELEASE_NOTES.md", ($out -join "`n") + "`n")
          Get-Content RELEASE_NOTES.md

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @files --title "ODM ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
